server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: let React Router handle unknown paths client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache env-config.js - it's regenerated per-container-start and
    # must be re-fetched on every page load, unlike the hashed JS/CSS bundle.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }
}
